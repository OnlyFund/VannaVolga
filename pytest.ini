# Full suite in parallel (about 1 minute on 8 cores, 4 serially):
#   python -m pytest -n auto --dist loadfile
# Quick tier per change: add -m "not golden". loadfile keeps each file on one
# worker, so a module's market fixtures are built once.
[pytest]
testpaths = tests
markers =
    golden: end-to-end golden tests on frozen markets (about 1.5 minutes); skip with -m "not golden"
